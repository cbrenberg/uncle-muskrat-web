<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover lets the page paint into the notch and home-indicator
       strips, so those blend with whatever layer is at that edge instead of
       Safari picking a fill colour for them. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Uncle Muskrat — official site. Shows, music, and media.">
  <meta name="author" content="Uncle Muskrat">

  <!-- Favicons -->
  <link rel="apple-touch-icon" sizes="180x180" href="img/icons/favicon_io/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="img/icons/favicon_io/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="img/icons/favicon_io/favicon-16x16.png">
  <link rel="manifest" href="img/icons/favicon_io/site.webmanifest">

  <title>Uncle Muskrat</title>

  <!-- Icons (brand font is bundled via @font-face in css/refresh.css) -->
  <link href="font-awesome/css/font-awesome.min.css" rel="stylesheet" type="text/css">

  <!-- Site styles -->
  <link href="css/refresh.css" rel="stylesheet">
</head>

<body id="page-top">

  <!-- The ridge headers rest stacked at the bottom of the viewport as a range.
       Each one is bottom-sticky: it is held there until the page has scrolled
       far enough for its own place in the document to arrive, at which point it
       releases and scrolls off the top with its section. No scripting — every
       moving thing moves 1:1 with the scroll. -->
  <div id="page">

    <!-- Decorative back ridge (bg6): held at the bottom of the viewport behind
         everything else, so it fills out the range on load and is then covered
         up as each section scrolls over it. Declared before the logo so the
         logo always paints on top. -->
    <img class="terrain terrain--back" src="img/bg6.png" width="1920" height="570" alt="" aria-hidden="true">

    <header id="hero">
      <div class="hero__logo">
        <img src="img/banner_shrunk.png" width="1920" height="840" alt="Uncle Muskrat">
      </div>
    </header>

    <!-- Shows — back ridge (bg5, lightest) -->
    <div class="ridge ridge--shows" aria-hidden="true"><img src="img/bg5.png" width="1920" height="535" alt=""></div>
    <section id="shows" class="content content--shows">
      <div class="content__inner">
        <h2 class="content__heading">Shows</h2>
        <div class="bandsintown">
          <script charset="utf-8" src="https://widget.bandsintown.com/main.min.js"></script>
          <a class="bit-widget-initializer" data-artist-name="id_15394482"
            data-font="'American Typewriter', 'Ultra', sans-serif" data-language="en"
            data-display-details="false" data-text-color="#FFFFFF" data-display-logo="false"
            data-separator-color="#FFFFFF" data-popup-background-color="#615CBF" data-link-color="#FFFFFF"
            data-link-text-color="#615CBF" data-display-play-my-city="false"></a>
        </div>
      </div>
    </section>

    <!-- Bio — ridge (bg4) -->
    <div class="ridge ridge--bio" aria-hidden="true"><img src="img/bg4.png" width="1920" height="567" alt=""></div>
    <section id="bio" class="content content--bio">
      <div class="content__inner">
        <h2 class="content__heading">The Band</h2>
        <!-- TODO: replace bio copy below with real band bio -->
        <p class="bio__blurb">
          Uncle Muskrat is a four-piece band serving up their own brand of high-energy
          roots rock. This is placeholder text — swap it out for the real story.
        </p>
        <!-- /TODO -->
        <ul class="bio__grid">
          <li class="bio__member">
            <img src="img/team/aaron.png" alt="Aaron" class="bio__photo">
            <span class="bio__name">Aaron</span>
          </li>
          <li class="bio__member">
            <img src="img/team/chris.png" alt="Chris" class="bio__photo">
            <span class="bio__name">Chris</span>
          </li>
          <li class="bio__member">
            <img src="img/team/conor.png" alt="Conor" class="bio__photo">
            <span class="bio__name">Conor</span>
          </li>
          <li class="bio__member">
            <img src="img/team/tim.png" alt="Tim" class="bio__photo">
            <span class="bio__name">Tim</span>
          </li>
          <li class="bio__member bio__member--placeholder">
            <!-- TODO: replace with <img src="img/team/alex.png" alt="Alex" class="bio__photo"> -->
            <span class="bio__photo bio__photo--placeholder" role="img" aria-label="Alex photo coming soon">?</span>
            <span class="bio__name">Alex</span>
          </li>
        </ul>
      </div>
    </section>

    <!-- Media — ridge (bg3) -->
    <div class="ridge ridge--media" aria-hidden="true"><img src="img/bg3.png" width="1920" height="474" alt=""></div>
    <section id="media" class="content content--media">
      <div class="content__inner">
        <h2 class="content__heading">Media</h2>
        <div class="media__video">
          <iframe src="https://www.youtube.com/embed/videoseries?si=mqbKj9-F-2SrnYC8&amp;list=PLg6ugZZhPvOGj6RbmeKoGmIBG9j5WVP4z"
            title="Uncle Muskrat on YouTube" frameborder="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        </div>
        <div class="media__gallery">
          <figure class="media__shot">
            <img src="img/UncleMuskratValleyfairSoundcheck.jpg" alt="Uncle Muskrat soundcheck at Valleyfair" loading="lazy">
          </figure>
          <figure class="media__shot">
            <img src="img/UncleMuskratTrioDerbyDay.jpg" alt="Uncle Muskrat trio on Derby Day" loading="lazy">
          </figure>
          <figure class="media__shot">
            <img src="img/UncleMuskratFatherHennepin.jpg" alt="Uncle Muskrat at Father Hennepin" loading="lazy">
          </figure>
        </div>
      </div>
    </section>

    <!-- Contact — front ridge (bg2, darkest) -->
    <div class="ridge ridge--contact" aria-hidden="true"><img src="img/bg2.png" width="1920" height="318" alt=""></div>
    <section id="contact" class="content content--contact">
      <div class="content__inner">
        <h2 class="content__heading">Contact Us</h2>
        <div class="contact__social">
          <a href="https://www.facebook.com/unclemuskrat/" target="_blank" rel="noopener" aria-label="Facebook">
            <i class="fa fa-lg fa-facebook"></i></a>
          <a href="https://www.instagram.com/unclemuskrat/" target="_blank" rel="noopener" aria-label="Instagram">
            <i class="fa fa-lg fa-instagram"></i></a>
          <a href="https://open.spotify.com/artist/6wQ3Iph052h2tEVeXWaiDh" target="_blank" rel="noopener" aria-label="Spotify">
            <i class="fa fa-lg fa-spotify"></i></a>
          <a href="https://www.youtube.com/@unclemuskrat" target="_blank" rel="noopener" aria-label="YouTube">
            <i class="fa fa-lg fa-youtube"></i></a>
          <a href="https://bnds.us/j6qlrh" target="_blank" rel="noopener" aria-label="Bandsintown">
            <svg width="23px" height="20px" viewBox="0 0 23 24" role="img" aria-labelledby="bit-imgTitle">
              <title id="bit-imgTitle">Bandsintown</title>
              <path d="M17.709,0 L22.917,0 L22.917,12.343 L17.709,12.343 L17.709,0 Z M11.806,5.829 L17.014,5.829 L17.014,12.343 L11.806,12.343 L11.806,5.829 Z M5.903,5.829 L11.111,5.829 L11.111,12.343 L5.903,12.343 L5.903,5.829 Z M22.917,24 L0,24 L0,0 L5.208,0 L5.208,18.857 L17.708,18.857 L17.708,18.171 L5.904,18.171 L5.904,13.03 L22.918,13.03 L22.918,24 L22.917,24 Z" fill="currentColor"></path>
            </svg>
          </a>
        </div>
        <address class="contact__booking">
          <a href="mailto:booking@unclemuskrat.com">booking@unclemuskrat.com</a>
        </address>
        <div class="contact__epk">
          <a href="./assets/uncle-muskrat-epk.pdf" target="_blank" rel="noopener">EPK and Stage Plot</a>
        </div>
        <p class="contact__copy">&copy; Uncle Muskrat</p>
      </div>
    </section>

  </div><!-- /#page -->

  <!-- Decorative front ridge (bg1, darkest): fixed at the bottom, in front of
       everything, through all scrolling -->
  <img class="terrain terrain--front" src="img/bg1.png" width="1920" height="245" alt="" aria-hidden="true">

  <!-- Sits near the bottom of the first screen, in front of the range, and
       simply scrolls away with the page -->
  <span class="scroll-cue" aria-hidden="true"><span class="scroll-cue__chevron"></span></span>

  <!-- TEMPORARY DIAGNOSTIC - REMOVE BEFORE MERGING (see css/refresh.css).
       Tests whether Safari will sample a fixed element at the top edge to tint
       the notch strip. Deliberately bright green so the answer is unambiguous:
       any green in that strip means the sampling path works, and a sticky bar
       per section could then drive it properly. A real element, not a pseudo,
       and it meets every documented condition - flush to the top, full width,
       4px tall, fully opaque, and carrying no opacity property. -->
  <div class="notch-probe" aria-hidden="true"></div>

</body>

</html>
